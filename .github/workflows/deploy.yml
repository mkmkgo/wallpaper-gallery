name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 取图床仓库最新 tag 作为 CDN_VERSION。
      # 走 scripts/get-latest-cdn-tag.js：git ls-remote（无鉴权、无 API 配额）
      # → GitHub API（带类型守卫）→ 本地 constants.js → 硬兜底，逐级降级，
      # 不会像旧的 `curl api.github.com | jq '.[0].name'` 那样在 API 限流
      # 返回错误对象时以 `Cannot index object with number` 崩溃、拖垮整条流水线。
      - name: Get latest CDN version
        id: cdn_version
        run: |
          LATEST_TAG=$(node scripts/get-latest-cdn-tag.js)
          echo "version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "✅ CDN version: $LATEST_TAG"

      - name: Update CDN version in constants.js
        run: |
          CDN_VERSION="${{ steps.cdn_version.outputs.version }}"
          sed -i "s/export const CDN_VERSION = '[^']*'/export const CDN_VERSION = '$CDN_VERSION'/" src/utils/config/constants.js
          echo "📦 Updated constants.js to: $CDN_VERSION"
          grep -q "export const CDN_VERSION = '$CDN_VERSION'" src/utils/config/constants.js \
            || { echo "::error::constants.js 的 CDN_VERSION 未能更新为 $CDN_VERSION"; exit 1; }

      # 同一个版本号也写进小程序的远程配置 public/miniapp/config.json（cdnTag 字段）。
      # 小程序启动时会拉取该文件，用 cdnTag 覆盖代码内置的兜底版本号——
      # 于是「图仓发布新 tag → 站点部署」之后，已经上线的小程序不必重新发版
      # 就能取到新上传的图片。脚本取不到合法版本号时原样跳过，保留仓库内已有值。
      - name: Sync cdnTag to miniapp config
        run: |
          CDN_VERSION="${{ steps.cdn_version.outputs.version }}"
          node scripts/set-miniapp-cdn-tag.js "$CDN_VERSION"
          grep -q "\"cdnTag\": \"$CDN_VERSION\"" public/miniapp/config.json \
            || echo "::warning::miniapp/config.json 的 cdnTag 未同步，沿用仓库内已有值"

      # 图床仓只取数据目录，不取图片二进制（图片走 CDN，构建期用不到）。
      # sparse-checkout 把下行从 ~4.85GB（fetch-depth: 0 拉全量历史 + 全部原图）
      # 降到 ~5MB（data/ 4.2M + bing/meta 0.86M）。
      # 旧的 fetch-depth: 0 注释称「用于 git diff 查找新增图片」，但脚本里并未实现该用途。
      # ⚠️ bing/meta 在 data/ 之外，必须与 data 一并列出，否则 Bing 系列数据会静默丢失。
      - name: Checkout nuanXinProPic (wallpaper source)
        uses: actions/checkout@v4
        with:
          repository: mkmkgo/nuanXinProPic
          path: nuanXinProPic
          fetch-depth: 1
          sparse-checkout: |
            data
            bing/meta
          sparse-checkout-cone-mode: false

      # [LOCAL] desktop 分仓：从 nuanXinProPic-desktop 取 desktop 数据
      # continue-on-error 保证分仓仓库尚未创建时主站部署不中断（仅缺 desktop 数据）。
      #
      # ➕ 新增第 3 / 4 / 5 个仓库：整体复制下面这个 step，只改 2 处——
      #   1) repository: mkmkgo/nuanXinProPic-<新系列>
      #   2) path:       nuanXinProPic-<新系列>
      #   其余（fetch-depth: 1 / sparse-checkout: data / continue-on-error）保持原样。
      #   每个仓 sparse 后只有几 MB，5 个仓串行 checkout 也就 ~15s，无需 matrix。
      #   再在下方 "Copy data from image repository" 步骤按同样路径加一段 cp 即可。
      - name: Checkout nuanXinProPic-desktop (desktop shard)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: mkmkgo/nuanXinProPic-desktop
          path: nuanXinProPic-desktop
          fetch-depth: 1
          sparse-checkout: data
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy data from image repository
        run: |
          mkdir -p public/data
          if [ -d "nuanXinProPic/data" ]; then
            echo "📦 Copying data from nuanXinProPic/data..."
            # 同步主系列（desktop 已迁至分仓 nuanXinProPic-desktop）
            for series in mobile avatar video; do
              if [ -d "nuanXinProPic/data/$series" ]; then
                cp -r "nuanXinProPic/data/$series" public/data/
              fi
              if [ -f "nuanXinProPic/data/$series.json" ]; then
                cp "nuanXinProPic/data/$series.json" public/data/
              fi
            done
            if [ -d "nuanXinProPic/bing/meta" ]; then
              mkdir -p public/data/bing
              cp -r nuanXinProPic/bing/meta/* public/data/bing/
            fi
          else
            echo "⚠️ Data directory not found, fallback to pnpm sync"
            pnpm sync
          fi
          # desktop 数据来自分仓仓库
          if [ -d "nuanXinProPic-desktop/data/desktop" ]; then
            echo "📦 Copying desktop data from nuanXinProPic-desktop..."
            cp -r "nuanXinProPic-desktop/data/desktop" public/data/
            if [ -f "nuanXinProPic-desktop/data/desktop.json" ]; then
              cp "nuanXinProPic-desktop/data/desktop.json" public/data/
            fi
          fi

      # Supabase 资产同步失败**不阻断部署**。
      # 背景（2026-10-16）：上游 v5.1.0 新增视频壁纸系列后，sync:assets 会写
      # duration_seconds 列；旧表缺该列时这一步硬失败，连带 Build/Publish/Deploy
      # 全部 skipped，线上卡在旧版本。而 Supabase 在本项目是渐进增强能力，
      # 核心浏览/预览/下载走 CDN 静态 JSON，零 Supabase 依赖，因此不该阻断部署。
      - name: Sync wallpaper assets to Supabase
        id: sync_assets
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm sync:assets

      - name: Report Supabase sync failure
        if: steps.sync_assets.outcome == 'failure'
        run: |
          echo "::warning::wallpaper_assets 同步失败，已跳过，不阻断部署。"
          echo "::warning::常见原因：表缺列（如 v5.1.0 新增的 duration_seconds）、series 约束未放行 'video'、PostgREST schema 缓存未刷新。"
          echo "::warning::修复手册：docs/supabase-schema-fix-2026-10-16.md"
          echo "::warning::影响范围：仅后台资产表不再更新；壁纸浏览/预览/下载不受影响。"

      - name: Refresh recent hot tags from deployed metadata
        run: pnpm export:hot-tags

      # 5. 执行 Vite 打包构建并生成关键路由静态 HTML
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:seo

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wallpaper-gallery-prod --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Submit to search engines
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          SITE_URL: https://wall.202597.xyz
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/submit-search-engines.js

      - name: Purge jsDelivr CDN cache
        run: |
          BASE="gh/mkmkgo/nuanXinProPic@main"
          PURGE_PATHS=(
            "$BASE/data/mobile/latest.json"
            "$BASE/data/mobile/index.json"
            "$BASE/data/desktop/latest.json"
            "$BASE/data/desktop/index.json"
            "$BASE/data/avatar/latest.json"
            "$BASE/data/avatar/index.json"
            "$BASE/data/bing/latest.json"
            "$BASE/data/bing/index.json"
            "$BASE/data/collections.json"
            "$BASE/data/stats/hot-mobile.json"
          )
          for series in mobile avatar; do
            if [ -d "nuanXinProPic/data/$series" ]; then
              for f in nuanXinProPic/data/$series/*.json; do
                fname=$(basename "$f")
                PURGE_PATHS+=("$BASE/data/$series/$fname")
              done
            fi
          done
          if [ -d "nuanXinProPic-desktop/data/desktop" ]; then
            for f in nuanXinProPic-desktop/data/desktop/*.json; do
              fname=$(basename "$f")
              PURGE_PATHS+=("$BASE/data/desktop/$fname")
            done
          fi
          echo "🗑️ Purging ${#PURGE_PATHS[@]} CDN files..."
          for path in "${PURGE_PATHS[@]}"; do
            echo "  Purging $path..."
            curl -s "https://purge.jsdelivr.net/$path" | head -c 200
            echo ""
            sleep 0.5
          done
          echo "✅ CDN cache purge completed (total: ${#PURGE_PATHS[@]} files)"
